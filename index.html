<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="main.css">
  </head>

  <body>
    <div class="scanlines"></div>

    <div class="intro-wrap">
      <div class="noise"></div>
      <div class="noise noise-moving"></div>

      <div class="play" data-splitting>Juampatronics</div>
      <div class="time">--:--</div>
      <div class="recordSpeed" id="timer">SLP 0:00:00</div>
    </div>

    <script type="text/javascript">
      let count = 5;
      let timer = document.querySelector('#timer');
      setInterval(function(){
          count--;
          timer.textContent = `SLP 00:00:${count.toString().padStart(2, '0')}`;
          if (count == 0) {
              window.location = 'https://github.com/juampatronics'; 
          }
      }, 1000);
    </script>
  </body>

</html>
